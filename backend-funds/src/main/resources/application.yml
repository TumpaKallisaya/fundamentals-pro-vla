spring:
  application:
    name: backend-funds
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/funds
    username: funds
    password: funds
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/New_York

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

server:
  port: 8080

app:
  fuentes:
    forexfactory:
      url: https://nfs.faireconomy.media/ff_calendar_thisweek.json
    fred:
      api-key: ${FRED_API_KEY:}
