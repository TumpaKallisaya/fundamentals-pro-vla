services:
  postgres:
    image: postgres:18.6
    container_name: funds-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: funds
      POSTGRES_USER: funds
      POSTGRES_PASSWORD: funds
    ports:
      - "5432:5432"
    volumes:
      - funds_pgdata:/var/lib/postgresql/data

volumes:
  funds_pgdata:
